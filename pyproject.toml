[project]
name = "continuum"
version = "0.1.0"
description = "General-purpose graph investigation engine"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/continuum"]
